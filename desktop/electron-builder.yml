appId: io.visualzpl.desktop
productName: VisualZPL
copyright: VisualZPL

directories:
  output: dist-app
  buildResources: build

# Only the app runtime is packaged — the renderer is the built frontend.
files:
  - main.cjs
  - package.json
  - renderer/**/*

# Auto-release: `electron-builder --publish always` (on a v* tag in CI) creates
# / updates a GitHub Release for the tag and uploads the artifacts to it.
# owner/repo are explicit — the git remote can't be auto-detected after the
# repository was renamed/moved.
publish:
  provider: github
  owner: xgeekover
  repo: Visualzpl

# ── No-install artifacts per OS ─────────────────────────────────────────────
# Windows ships THREE flavours so locked-down / air-gapped (폐쇄망) PCs have a
# path that corporate policy won't block:
#   * zip       → unzip anywhere, run VisualZPL.exe. No installer, and (unlike
#                 portable) no %TEMP% self-extraction, so AppLocker/SRP rules
#                 that forbid running executables from temp don't kill it.
#   * nsis      → classic per-user installer; runs from a real install dir.
#   * portable  → single self-extracting .exe (convenient, but self-extracts to
#                 %TEMP% first — may be blocked by corporate AppLocker).
# All three carried DISTINCT artifact names; previously portable + nsis shared
# one name (…-win-x64.exe) and collided, so only one actually reached Releases.
win:
  target:
    - target: zip
    - target: nsis
    - target: portable
  artifactName: ${productName}-${version}-win-${arch}.${ext}   # → zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

mac:
  target:
    - target: dmg
    - target: zip         # portable: unzip → drag VisualZPL.app to run
  category: public.app-category.productivity
  # Unsigned build: ships without an Apple Developer signature. Gatekeeper will
  # require right-click → Open on first launch. Set identity for a signed build.
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage    # single executable file, no install
  category: Graphics
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
